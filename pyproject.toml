[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notifly"
version = "1.0.0"
description = "A Telegram bot for notes and reminders, with testable handlers and SQLite storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Talha Arshad" }]
dependencies = ["python-telegram-bot[job-queue]>=21"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff==0.16.9"]

[project.scripts]
notifly = "notifly.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
